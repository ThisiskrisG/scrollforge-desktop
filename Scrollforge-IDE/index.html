<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scrollforge IDE - Final</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:Segoe UI,sans-serif; background:#0a0a0a; color:#d4d4d4; height:100vh; overflow:hidden; }
    header { background:#1f1f1f; padding:10px 20px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #333; }
    .logo { font-size:28px; font-weight:bold; color:#00bfff; cursor:pointer; text-shadow:0 0 15px #00bfff; }
    #layout { display:flex; height:calc(100vh - 52px); }
    #sidebar { width:240px; background:#1f1f1f; padding:15px; border-right:1px solid #333; overflow-y:auto; }
    #main { flex:1; display:flex; flex-direction:column; }
    .CodeMirror { height:100% !important; }
    #preview { flex:1; border-top:1px solid #333; background:#fff; overflow:auto; }
    button { background:#007acc; color:white; border:none; padding:8px 16px; margin:4px; border-radius:4px; cursor:pointer; }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcode.js@1.0.0/qrcode.min.js"></script>
</head>
<body>
  <header>
    <div class="logo" onclick="triggerZap()">🌀 Scrollforge IDE</div>
    <div>
      <button onclick="loadFile('main.py')">🐍 Python</button>
      <button onclick="runCode()">▶ Run</button>
      <button onclick="toggleVault()">🔒 Vault</button>
    </div>
  </header>

  <div id="layout">
    <div id="sidebar">
      <h3>📁 Files</h3>
      <ul id="file-list">
        <li onclick="loadFile('main.py')">main.py</li>
      </ul>
      <div id="vault-tab" style="display:none;margin-top:20px;">
        <h3>🔒 Psud Vault</h3>
        <input type="password" id="vault-pass" placeholder="Vault Password" style="width:100%;padding:8px;margin-bottom:8px;"/>
        <button onclick="unlockVault()" style="width:100%;">Unlock</button>
        <div id="vault-content" style="margin-top:10px;"></div>
      </div>
    </div>
    <div id="main">
      <div id="editor-container" style="flex:1"><textarea id="editor"></textarea></div>
      <div id="status">Ready</div>
      <iframe id="preview" style="flex:1;border:none"></iframe>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>

  <script>
    let editor, pyodideInstance;
    window.onload = async () => {
      editor = CodeMirror.fromTextArea(document.getElementById("editor"), {
        lineNumbers: true,
        mode: 'python',
        theme: 'dracula'
      });
      pyodideInstance = await loadPyodide();
      loadFile('main.py');
    };
    function loadFile(name) {
      editor.setValue('print("Hello from Scrollforge!")');
    }
    async function runCode() {
      document.getElementById('status').textContent = 'Running...';
    }
    function triggerZap() { alert("⚡ ZAP!"); }
    function toggleVault() { document.getElementById('vault-tab').style.display = 'block'; }
    function unlockVault() { alert("Vault + QR Ready!"); }
  </script>
</body>
</html>
