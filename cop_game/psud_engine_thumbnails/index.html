    <h3>📜 Scroll Gallery</h3>
    <div id="scrollGallery" style="max-height:150px; overflow:auto; background:#222; color:white; padding:5px; font-size: 12px;"></div>
    <button onclick="refreshScrollGallery()">Refresh Gallery</button>
    </div>
