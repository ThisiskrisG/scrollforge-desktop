
<!DOCTYPE html>
<html>
<head>
  <title>Psud IDE – Hover Car View</title>
  <style>
    body { margin: 0; background: #111; overflow: hidden; }
    #grid {
      width: 960px; height: 480px;
      margin: 0 auto; position: relative;
      background: linear-gradient(to top, #223344 0%, #8899aa 100%);
      border-top: 10px solid #333;
    }
    .car {
      position: absolute;
      width: 64px;
      height: 32px;
      background-image: url('hovercar.png');
      background-size: cover;
    }
    .shadow {
      position: absolute;
      width: 64px;
      height: 10px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 50%;
      transform: translateY(40px);
    }
  </style>
</head>
<body>
  <div id="grid"></div>
  <script>
    const TILE_SIZE = 32;
    const grid = document.getElementById("grid");
    const tiles = {};
    const physics = {};

    function spawnObject(id, x, y, type = "car") {
      const wrapper = document.createElement("div");
      wrapper.className = "car";
      wrapper.style.left = x * TILE_SIZE + "px";
      wrapper.style.top = y * TILE_SIZE + "px";
      wrapper.dataset.id = id;

      const shadow = document.createElement("div");
      shadow.className = "shadow";
      shadow.style.left = x * TILE_SIZE + "px";
      shadow.style.top = y * TILE_SIZE + "px";

      grid.appendChild(shadow);
      grid.appendChild(wrapper);

      tiles[id] = { x, y, type, el: wrapper, shadow };
    }

    function setVelocity(id, vx, vy) {
      physics[id] = { vx, vy };
    }

    function applyPhysics() {
      for (let id in physics) {
        const obj = tiles[id];
        const p = physics[id];
        if (!obj) continue;
        obj.x += p.vx * 0.1;
        obj.y += p.vy * 0.1;
        obj.el.style.left = obj.x * TILE_SIZE + "px";
        obj.el.style.top = obj.y * TILE_SIZE + "px";
        obj.shadow.style.left = obj.x * TILE_SIZE + "px";
        obj.shadow.style.top = obj.y * TILE_SIZE + "px";
      }
    }

    setInterval(applyPhysics, 100);

    function runPsudScroll() {
      const scroll = localStorage.getItem("psud_scroll_run");
      if (!scroll) return;
      const lines = scroll.split("\n");
      for (let line of lines) {
        if (line.includes("spawn")) {
          const match = line.match(/spawn\s+"(\w+)" at (\d+) (\d+)(?: type "(\w+)")?/);
          if (match) {
            const type = match[4] || "car";
            spawnObject(match[1], parseInt(match[2]), parseInt(match[3]), type);
          }
        } else if (line.includes("velocity")) {
          const match = line.match(/velocity\s+"(\w+)" (-?\d+(?:\.\d+)?) (-?\d+(?:\.\d+)?)/);
          if (match) {
            setVelocity(match[1], parseFloat(match[2]), parseFloat(match[3]));
          }
        }
      }
      localStorage.removeItem("psud_scroll_run");
    }

    setInterval(runPsudScroll, 500);
  </script>
</body>
</html>
