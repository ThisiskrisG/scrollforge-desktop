
<!DOCTYPE html>
<html>
<head>
  <title>KristonIDE</title>
  <style>
    body { background: #1a1a1a; color: white; font-family: monospace; padding: 20px; }
    textarea { width: 100%; height: 300px; background: #111; color: #0f0; font-size: 16px; }
    select, button { margin-top: 10px; font-size: 14px; }
  </style>
</head>
<body>
  <h2>🧠 KristonIDE</h2>
  <label>Scroll:</label>
  <select id="scrolls" onchange="loadScroll()">
    <option value="echo_scroll">echo_scroll</option>
    <option value="boost_scroll">boost_scroll</option>
  </select>
  <textarea id="editor">echo "It begins"</textarea>
  <br>
  <button onclick="runScroll()">▶ Run Scroll</button>
  <script>
    const scrolls = {
      echo_scroll: 'echo "It begins"',
      boost_scroll: 'ripple "boost_zone"'
    };
    function loadScroll() {
      const selected = document.getElementById("scrolls").value;
      document.getElementById("editor").value = scrolls[selected];
    }
    function runScroll() {
      const code = document.getElementById("editor").value;
      console.log("Running scroll:", code);
      alert("🌀 Scroll executed: " + code);
    }
  </script>
</body>
</html>
