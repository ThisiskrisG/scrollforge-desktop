
<!DOCTYPE html>
<html>
<head>
  <title>Kriston IDE – Traps & Win</title>
  <style>
    body { margin: 0; background: #0a0a0a; color: #fff; font-family: monospace; }
    textarea {
      width: 90%; height: 300px; margin: 10px auto; display: block;
      background: #111; color: #0ff; border: 1px solid #333;
      font-size: 16px; padding: 10px; border-radius: 6px;
    }
    button {
      display: block; margin: 10px auto; font-size: 16px;
      padding: 10px; border-radius: 6px; background: #0ff; color: #000;
      border: none;
    }
  </style>
</head>
<body>
  <textarea id="scroll">spawn "car" at 2 10 type "car"
velocity "car" 1.5 0

spawn "boost" at 4 10 type "boost"
spawn "fuel" at 6 10 type "fuel"
spawn "trap" at 8 10 type "trap"
spawn "enemy" at 10 10 type "enemy"
spawn "checkpoint" at 14 10 type "checkpoint"
spawn "finish" at 18 10 type "finish"

on_collide "car" with "boost" velocity "car" 3 0
on_collide "car" with "fuel" change_color "car" "#0f0"
on_collide "car" with "trap" velocity "car" 0.5 0
on_collide "car" with "enemy" velocity "car" -1 0
on_collide "car" with "checkpoint" hud_set "checkpoint" 1
on_collide "car" with "finish" hud_set "win" 1</textarea>
  <button id="run">▶ Run Scroll</button>
  <script>
    document.getElementById("run").onclick = () => {
      localStorage.setItem("psud_scroll_run", document.getElementById("scroll").value);
    };
  </script>
</body>
</html>
