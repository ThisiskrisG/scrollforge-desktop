
<!DOCTYPE html>
<html>
<head>
  <title>Plugin Store</title>
  <style>
    body { margin: 0; background: #121212; color: #fff; font-family: sans-serif; padding: 20px; }
    h1 { text-align: center; }
    input {
      display: block; margin: 20px auto; width: 60%%;
      padding: 10px; font-size: 16px;
      background: #222; color: #fff; border: 1px solid #444;
    }
    .plugin {
      background: #1e1e1e; border: 1px solid #333; padding: 10px;
      margin: 10px auto; width: 60%%; border-radius: 6px;
    }
    .plugin h3 { margin: 0; color: #0ff; }
    .plugin button {
      background: #444; color: #fff; border: none; padding: 8px 12px;
      border-radius: 4px; cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Plugin Store</h1>
  <input type="text" id="search" placeholder="Search plugins...">
  <div id="pluginList"></div>
  <script>
    const plugins = [
      {
        name: "enemy_logic",
        version: "1.0",
        description: "Adds patrol movement logic to enemy components.",
        tags: ["enemy", "movement", "patrol"]
      }
    ];

    function renderList(filter = "") {
      const list = document.getElementById("pluginList");
      list.innerHTML = "";
      const filtered = plugins.filter(p => p.name.includes(filter) || p.tags.join(" ").includes(filter));
      filtered.forEach(p => {
        const div = document.createElement("div");
        div.className = "plugin";
        div.innerHTML = `
          <h3>${p.name} <small>v${p.version}</small></h3>
          <p>${p.description}</p>
          <button onclick="alert('Installed ${p.name}')">Install</button>
        `;
        list.appendChild(div);
      });
    }

    document.getElementById("search").addEventListener("input", e => {
      renderList(e.target.value.toLowerCase());
    });

    renderList();
  </script>
</body>
</html>
