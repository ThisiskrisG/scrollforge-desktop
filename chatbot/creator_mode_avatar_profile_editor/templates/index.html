<!DOCTYPE html>
<html>
<head>
    <title>Creator Mode - Profile Editor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="profile-editor">
        <h2>Edit Your Profile</h2>
        <form id="profileForm">
            <input type="text" name="name" placeholder="Enter your name" required><br>
            <input type="file" name="avatar" accept="image/*" required><br>
            <button type="submit">Save Profile</button>
        </form>
        <div id="preview">
            <h3>Live Preview</h3>
            <img id="avatarPreview" src="/uploads/avatars/default.png" width="100" height="100"><br>
            <span id="namePreview">Guest</span>
        </div>
    </div>
    <script>
        const form = document.getElementById('profileForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const res = await fetch('/upload_avatar', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.success) {
                document.getElementById('avatarPreview').src = '/uploads/avatars/' + data.profile.avatar;
                document.getElementById('namePreview').textContent = data.profile.name;
            }
        });
    </script>
</body>
</html>
