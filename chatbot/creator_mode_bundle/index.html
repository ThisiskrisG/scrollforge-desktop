
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Creator Mode Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="dashboard">
        <div id="controls">
            <button id="micToggle">🎤 Mic</button>
            <button id="camToggle">📷 Camera</button>
            <button id="screenShare">🖥️ Share Screen</button>
        </div>
        <div id="chat">
            <textarea id="chatBox" placeholder="Type a message..."></textarea>
            <button id="sendBtn">Send</button>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
