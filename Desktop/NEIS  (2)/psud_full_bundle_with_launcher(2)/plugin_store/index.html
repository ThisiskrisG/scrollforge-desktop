
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Psud Plugin Store</title>
  <style>
    body { background: #111; color: #fff; font-family: sans-serif; }
    h1 { text-align: center; }
  </style>
</head>
<body>
  <h1>🛍️ Psud Plugin Store</h1>
  
  <hr style="margin: 40px 0;">
  <h2 style="text-align: center;">📤 Submit Your Plugin</h2>
  <div style="width: 80%; margin: auto; background: #222; padding: 20px; border: 1px solid #444;">
    <label>Upload .zip Plugin File: <input type="file" id="pluginZipUpload" accept=".zip"></label><br><br>
    <button onclick="previewUploadedPlugin()">🔍 Preview</button>
    <div id="uploadPreview" style="margin-top: 20px;"></div>
  </div>

  
  <hr style="margin: 40px 0;">
  <h2 style="text-align: center;">🔐 Admin Approval Panel</h2>
  <div style="width: 80%; margin: auto; background: #222; padding: 20px; border: 1px solid #444;">
    <label>Enter Admin Code: <input type="password" id="adminCodeInput" placeholder="••••••••••••••"></label>
    <button onclick="unlockAdminPanel()">🔓 Unlock</button>
    <div id="pendingPluginsPanel" style="display: none; margin-top: 20px;">
      <h3>Pending Plugins</h3>
      <div id="pendingList"></div>
    </div>
  </div>

  <div id="pluginStore" style="width: 80%; margin: auto;"></div>
  <script src="plugin_store.js"></script>
</body>
</html>
