
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scrollforge IDE + Browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="header">
    <button onclick="showSection('editor')">Editor</button>
    <button onclick="showSection('browser')">Browser</button>
  </div>

  <div id="editor" class="section">
    <textarea id="code" placeholder="Write your code here..."></textarea>
  </div>

  <div id="browser" class="section" style="display:none">
    <iframe id="browser-frame" src="browser/popup.html" style="width:100%; height:80vh; border:none;"></iframe>
  </div>

  <script>
    function showSection(id) {
      document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
      document.getElementById(id).style.display = 'block';
    }
  </script>
</body>
</html>
